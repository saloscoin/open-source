name: Build Linux CLI executables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core dependencies and packaging tool
        run: python -m pip install -r requirements-core.txt pyinstaller
      - name: Build command-line executables
        run: |
          python -m PyInstaller --onefile --name salocoind --add-data 'core/wordlist/english.txt:core/wordlist' salocoind.py
          python -m PyInstaller --onefile --name salocoin-cli salocoin-cli.py
      - name: Check executable help
        run: |
          dist/salocoind --help
          dist/salocoin-cli --help
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-linux-cli
          path: |
            dist/salocoind
            dist/salocoin-cli
          if-no-files-found: error
