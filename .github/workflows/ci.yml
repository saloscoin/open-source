name: CI

on:
  push:
    branches: [main, develop, docs/discoverability-security]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install core development dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run offline walkthrough
        run: python examples/offline_walkthrough.py
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Compile core entry points
        run: python -m compileall -q core network rpc examples scripts exchange_node.py salocoind.py
      - name: Check command-line help
        run: python salocoind.py --help
