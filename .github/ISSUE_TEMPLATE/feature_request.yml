name: Feature request
description: Suggest an improvement to the developer experience or implementation.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Include alternatives and consensus or compatibility implications, if any.
    validations:
      required: true
